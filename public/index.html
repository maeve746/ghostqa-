<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GhostQA</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #181b20;
        --muted: #68707d;
        --line: #d9dee7;
        --accent: #13795b;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .wrap {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 64px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0;
      }

      main {
        padding: 28px 0;
      }

      .grid {
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 20px;
        align-items: start;
      }

      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .panel {
        padding: 18px;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 16px;
      }

      label {
        display: block;
        margin: 14px 0 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 11px 12px;
        font: inherit;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
      }

      button {
        width: 100%;
        margin-top: 16px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        padding: 12px 14px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .status {
        display: inline-flex;
        border-radius: 999px;
        padding: 4px 9px;
        background: #eef2f7;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .status.pass {
        background: #dcfce7;
        color: #166534;
      }

      .status.fail {
        background: #fee2e2;
        color: var(--danger);
      }

      pre {
        min-height: 420px;
        margin: 0;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        color: #172033;
        background: #fbfcfe;
        border-top: 1px solid var(--line);
        padding: 16px;
        font-size: 13px;
        line-height: 1.5;
      }

      .result-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      @media (max-width: 820px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap topbar">
        <h1>GhostQA</h1>
        <span class="status" id="serverStatus">Ready</span>
      </div>
    </header>

    <main class="wrap">
      <div class="grid">
        <section class="panel">
          <h2>Run Test</h2>
          <form id="testForm">
            <label for="url">Website URL</label>
            <input id="url" name="url" value="http://localhost:3000" required />

            <label for="goal">Goal</label>
            <textarea id="goal" name="goal" required>Test whether signup works</textarea>

            <button id="runButton" type="submit">Run GhostQA</button>
          </form>
        </section>

        <section>
          <div class="panel result-head">
            <h2>Test Result</h2>
            <span class="status" id="resultStatus">No run yet</span>
          </div>
          <pre id="output">Submit a test to see history, evidence, screenshots, and trace path.</pre>
        </section>
      </div>
    </main>

    <script>
      const form = document.getElementById("testForm");
      const output = document.getElementById("output");
      const button = document.getElementById("runButton");
      const resultStatus = document.getElementById("resultStatus");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        button.disabled = true;
        resultStatus.className = "status";
        resultStatus.textContent = "Running";
        output.textContent = "Running test...";

        const payload = {
          url: form.url.value,
          goal: form.goal.value,
        };

        try {
          const response = await fetch("/api/test", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const data = await response.json();
          resultStatus.textContent = data.status || response.status;
          resultStatus.className = `status ${data.success ? "pass" : "fail"}`;
          output.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          resultStatus.textContent = "ERROR";
          resultStatus.className = "status fail";
          output.textContent = error instanceof Error ? error.message : "Unknown error";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
